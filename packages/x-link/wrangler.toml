name = "yieldcircle-xlink"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Secrets are NOT here: X_CLIENT_SECRET and XLINK_SECRET are set in the
# dashboard (Settings → Variables and Secrets, type Secret), and in a
# gitignored .dev.vars for `wrangler dev`.
[vars]
X_CLIENT_ID = ""
SOCIAL_URL = "https://social.1delta.io"
REDIRECT_URI = "https://xlink.yieldcircle.io/callback"
# The app's origins, comma-separated, so only they may call /challenge and /begin; the matching
# one is echoed with credentials (the /begin cookie needs it). The app is app.yieldcircle.io
# (.env.example, packages/web/vite.config.ts); yieldcircle.io is the landing. "*" in dev only.
ALLOWED_ORIGIN = "https://app.yieldcircle.io"

[[kv_namespaces]]
binding = "XLINK"
id = "dd34cb3c87b64dafb5523156ab334e8f"
