name = "yieldcircle-xlink"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Secrets are NOT here: X_CLIENT_SECRET and XLINK_SECRET are set in the
# dashboard (Settings → Variables and Secrets, type Secret), and in a
# gitignored .dev.vars for `wrangler dev`.
[vars]
X_CLIENT_ID = ""
SOCIAL_URL = "https://social.1delta.io"
REDIRECT_URI = "https://xlink.yieldcircle.io/callback"
# The app's origin, so only it may call /challenge and /begin. "*" in dev.
ALLOWED_ORIGIN = "https://yieldcircle.io"

[[kv_namespaces]]
binding = "XLINK"
id = "dd34cb3c87b64dafb5523156ab334e8f"
