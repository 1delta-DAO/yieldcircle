name = "yieldcircle-xlink"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The app's origin, so only it may call /challenge and /begin. "*" in dev.
[vars]
X_CLIENT_ID = ""
SOCIAL_URL = "https://social.1delta.io"
REDIRECT_URI = "https://yieldcircle-xlink.<subdomain>.workers.dev/callback"
ALLOWED_ORIGIN = "*"

# npx wrangler kv namespace create XLINK  → put the id here
[[kv_namespaces]]
binding = "XLINK"
id = ""

# npx wrangler secret put X_CLIENT_SECRET
# npx wrangler secret put XLINK_SECRET      (the same value as the social service's)
